name: Build MangaSplitter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Build with qmake
        run: |
          cd bin
          qmake MangaSplitor2.pro
          # 关键修复：添加 -lmingw32 解决链接问题
          mingw32-make -j4 CXXFLAGS="-D__MINGW32__" LFLAGS="-lmingw32"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaSplitter-Windows
          path: bin/release/MangaSplitor2.exe
