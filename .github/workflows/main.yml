name: Build MangaSplitter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2019   # 使用更稳定的环境
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.5.3 (MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with qmake
        run: |
          cd bin
          qmake MangaSplitor2.pro
          nmake

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaSplitter-Windows
          path: bin/release/MangaSplitor2.exe
