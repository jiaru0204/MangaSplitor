name: Build MangaSplitter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 先安装 MSYS2 (包含 MinGW)
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      # 2. 安装 Qt (使用与 MSYS2 兼容的版本)
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          setup-python: false
          tools-only: false

      # 3. 设置环境变量，优先使用 MSYS2 的工具链
      - name: Setup Environment
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 4. 编译
      - name: Build with qmake
        shell: msys2 {0}
        run: |
          cd bin
          export PATH="/c/msys64/mingw64/bin:$PATH"
          which g++
          g++ --version
          qmake MangaSplitor2.pro
          mingw32-make -j4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaSplitter-Windows
          path: bin/release/MangaSplitor2.exe
