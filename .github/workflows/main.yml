name: Build MangaSplitter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'        # 匹配你用的 6.8.6
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
      
      - name: Build with qmake
        run: |
          qmake MangaSplitter2.pro
          mingw32-make -j4
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaSplitter-Windows
          path: release/*.exe
